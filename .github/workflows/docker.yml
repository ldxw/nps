# 手动触发：构建 nps（服务端）与 npc（客户端）镜像，多架构（amd64 / arm64），只推送到 GitHub Container Registry。
#
# 镜像与标签：
#   ghcr.io/<owner>/nps:latest  +  ghcr.io/<owner>/nps:v0.26.39
#   ghcr.io/<owner>/npc:latest  +  ghcr.io/<owner>/npc:v0.26.39
#
# 版本号默认读 lib/version/version.go 里的 VERSION，也可在手动触发时填写（0.27.0 或 v0.27.0 都行）。
# 首次推送后包默认是私有的，需要在仓库 Packages 页面把可见性改成 Public。

name: Docker

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（留空则读 lib/version/version.go，例如 0.26.39 或 v0.26.39）"
        required: false
        default: ""
  # 默认分支上还没有本工作流时无法用 workflow_dispatch 触发，
  # 所以 docker 分支的提交也会自动构建一次；合并进默认分支后可只保留手动触发。
  push:
    branches:
      - docker
    paths-ignore:
      - "**.md"

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: nps
            dockerfile: ./Dockerfile.nps
          - name: npc
            dockerfile: ./Dockerfile.npc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 解析镜像名与版本号
        id: meta
        run: |
          set -euo pipefail

          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/${{ matrix.name }}"

          version='${{ github.event.inputs.version }}'
          if [ -z "$version" ]; then
              version=$(grep -oP 'VERSION\s*=\s*"\K[^"]+' lib/version/version.go | head -1 || true)
          fi
          version="${version#v}"

          if [ -z "$version" ]; then
              echo "未能确定版本号：请手动填写，或检查 lib/version/version.go 里的 VERSION" >&2
              exit 1
          fi

          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "镜像：$image   版本：v$version"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送（amd64 + arm64）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          # 避免向仓库推送 attestations，部分镜像仓库解析不了
          provenance: false
          sbom: false
          build-args: |
            GOPROXY=https://proxy.golang.org,direct
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:v${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
